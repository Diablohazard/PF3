<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header style="background: #cffbcd; color: rgb(0, 0, 0); display: flex; align-items: center; justify-content: space-between; padding: 10px;">
    <div style="flex: 1; text-align: left;">
        <form action="/" method="get" style="display: inline;">
            <button type="submit" style="background: rgb(0, 0, 0); color: #fcfcfc; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">
                Déconnexion
            </button>
        </form>
    </div>
    <div style="flex: 1; text-align: center; font-weight: bold;">
        OPERATEUR
    </div>
    <div style="flex: 1; text-align: right;" id="datetime"></div>
</header>

<div class="container">

    <div class="accordion">

        <!-- Historique -->
        <div class="accordion-item">
            <button class="accordion-header">Historique des commandes</button>
            <div class="accordion-content">
                <p>Contenu historique...</p>
            </div>
        </div>
    
        <!-- Consommation -->
        <div class="accordion-item">
            <button class="accordion-header">Suivi des consommations électriques</button>
            <div class="accordion-content">
                <div class="charts">
                    <div class="chart">Graphique 1</div>
                    <div class="chart">Graphique 2</div>
                </div>
            </div>
        </div>
    
        <!-- Maintenance -->
        <div class="accordion-item">
            <button class="accordion-header">Opérations de maintenance planifiées</button>
            <div class="accordion-content">
                <div class="maintenance">
                    <table>
                        <tr>
                            <th>Date</th>
                            <th>Commentaire</th>
                        </tr>
                    </table>
                    <button>BP Planifier</button>
                </div>
            </div>
        </div>
    
    </div>

</div>

<script>
    function updateDateTime() {
        const now = new Date();
    
        const date = now.toLocaleDateString('fr-FR');
        const time = now.toLocaleTimeString('fr-FR');
    
        document.getElementById("datetime").innerHTML = date + " " + time;
    }
    
    // Met à jour toutes les secondes
    setInterval(updateDateTime, 1000);
    
    // Lancer immédiatement
    updateDateTime();
</script>

<script>
    const headers = document.querySelectorAll(".accordion-header");
    
    headers.forEach(header => {
        header.addEventListener("click", () => {
            const content = header.nextElementSibling;
    
            if (content.style.maxHeight) {
                content.style.maxHeight = null;
            } else {
                content.style.maxHeight = content.scrollHeight + "px";
            }
        });
    });
    </script>

</body>
</html>
