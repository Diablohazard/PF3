<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    <div>OPERATEUR</div>
    <div id="datetime"></div>
</header>

<div class="container">

    <div class="section">
        <h3>Historique des commandes</h3>
    </div>

    <div class="section">
        <h3>Suivi des consommations électriques</h3>
        <div class="charts">
            <div class="chart">Graphique 1</div>
            <div class="chart">Graphique 2</div>
        </div>
    </div>

    <div class="section">
        <h3>Opérations de maintenance planifiées</h3>

        <div class="maintenance">
            <table>
                <tr>
                    <th>Date</th>
                    <th>Commentaire</th>
                </tr>
            </table>

            <button>BP Planifier</button>
        </div>
    </div>

</div>

<script>
    function updateDateTime() {
        const now = new Date();
    
        const date = now.toLocaleDateString('fr-FR');
        const time = now.toLocaleTimeString('fr-FR');
    
        document.getElementById("datetime").innerHTML = date + " " + time;
    }
    
    // Met à jour toutes les secondes
    setInterval(updateDateTime, 1000);
    
    // Lancer immédiatement
    updateDateTime();
</script>

</body>
</html>
