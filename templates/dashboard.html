<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    <div>OPERATEUR</div>
    <div>Date / Heure</div>
</header>

<div class="container">

    <div class="section">
        <h3>Historique des commandes</h3>
    </div>

    <div class="section">
        <h3>Suivi des consommations électriques</h3>
        <div class="charts">
            <div class="chart">Graphique 1</div>
            <div class="chart">Graphique 2</div>
        </div>
    </div>

    <div class="section">
        <h3>Opérations de maintenance planifiées</h3>

        <div class="maintenance">
            <table>
                <tr>
                    <th>Date</th>
                    <th>Commentaire</th>
                </tr>
            </table>

            <button>BP Planifier</button>
        </div>
    </div>

</div>

</body>
</html>
