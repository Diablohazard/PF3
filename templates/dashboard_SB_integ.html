<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Intégrateur</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header style="background: #cffbcd; color: rgb(0, 0, 0); display: flex; align-items: center; justify-content: space-between; padding: 10px;">
        <div style="flex: 1; text-align: left;">
            <form action="/" method="get" style="display: inline;">
                <button type="submit" style="background: rgb(0, 0, 0); color: #fcfcfc; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">
                    Déconnexion
                </button>
            </form>
        </div>
        <div style="flex: 1; text-align: center; font-weight: bold;">
            INTEGRATEUR
        </div>
        <div style="flex: 1; text-align: right;" id="datetime"></div>
    </header>

    <div class="container">
        <div class="accordion">

            <div class="accordion-item">
                <button class="accordion-header">Historique des commandes</button>
                <div class="accordion-content">
                    <p>Contenu historique...</p>
                </div>
            </div>

            <div class="accordion-item">
                <button class="accordion-header">Suivi des consommations électriques</button>
                <div class="accordion-content">
                    <div class="charts">
                        <div class="chart">Graphique 1</div>
                        <div class="chart">Graphique 2</div>
                    </div>
                </div>
            </div>

            <div class="accordion-item">
                <button class="accordion-header">Opérations de maintenance planifiées</button>
                <div class="accordion-content">
                    <div class="maintenance">
                        <table>
                            <tr>
                                <th>Date</th>
                                <th>Commentaire</th>
                            </tr>
                        </table>
                        <button id="openModalBtn">BP Planifier</button>
                    </div>
                </div>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 10px; align-items: flex-start;">
    
            <div class="accordion-item" style="flex: 1;">
                <button class="accordion-header" style="min-height: 120px; width: 100%; display: flex; align-items: center; justify-content: center; text-align: center;">
                    Charge CPU
                </button>
                <div class="accordion-content">
                    <div style="padding: 10px; text-align: center;">
                        <p>Utilisation : <span id="cpu-load">-- %</span></p>
                        <div style="width: 100%; background: #eee; height: 10px; border-radius: 5px;">
                            <div style="width: 45%; height: 100%; background: #4caf50; border-radius: 5px;"></div>
                        </div>
                    </div>
                </div>
            </div>

        <div class="accordion-item" style="flex: 1;">
            <button class="accordion-header" style="min-height: 120px; width: 100%; display: flex; align-items: center; justify-content: center; text-align: center;">
                RAM CPU
            </button>
            <div class="accordion-content">
                <div style="padding: 10px; text-align: center;">
                    <span id="ram-usage" style="font-size: 1.2rem; font-weight: bold;">8 / 16 Go</span>
                </div>
            </div>
        </div>

        <div class="accordion-item" style="flex: 1;">
            <button class="accordion-header" style="min-height: 120px; width: 100%; display: flex; align-items: center; justify-content: center; text-align: center;">
                Temp. CPU
            </button>
            <div class="accordion-content">
                <div style="padding: 10px; text-align: center;">
                    <span id="cpu-temp" style="font-size: 1.2rem; font-weight: bold; color: #e67e22;">55 °C</span>
                </div>
            </div>
        </div>
    </div>

    <div class="accordion-item" style="margin-top: 20px;">
                        <button class="accordion-header">Journal des Défauts Système</button>
                <div class="accordion-content">
                    <div style="padding: 15px;">
                        <table style="width: 100%; border-collapse: collapse; background: white;">
                                <thead>
                                        <tr style="background-color: #f3f4f6; border-bottom: 2px solid #e5e7eb;">
                                            <th style="padding: 12px; text-align: left;">Défaut</th>
                                            <th style="padding: 12px; text-align: left;">Apparition</th>
                                            <th style="padding: 12px; text-align: left;">Résolution</th>
                                            <th style="padding: 12px; text-align: center;">Statut</th>
                                        </tr>
                                </thead>
                             <tbody style="color: black;">
                                        <tr style="border-bottom: 1px solid #eee;">
                                            <td style="padding: 12px;">Surchauffe CPU (>85°C)</td>
                                            <td style="padding: 12px;">25/03/2026 14:30</td>
                                            <td style="padding: 12px;">25/03/2026 14:45</td>
                                            <td style="padding: 12px; text-align: center;">
                                                <span style="background: #d1fae5; color: #065f46; padding: 4px 8px; border-radius: 12px; font-size: 0.8rem;">Résolu</span>
                                            </td>
                                        </tr>
                                    <tr style="border-bottom: 1px solid #eee;">
                                         <td style="padding: 12px;">Perte connexion SQL</td>
                                         <td style="padding: 12px;">26/03/2026 09:12</td>
                                         <td style="padding: 12px; color: #9ca3af;">--</td>
                                         <td style="padding: 12px; text-align: center;">
                                            <span style="background: #fee2e2; color: #991b1b; padding: 4px 8px; border-radius: 12px; font-size: 0.8rem;">En cours</span>
                                         </td>
                                     </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
    </div>
                                </div> </div> </div> <div id="maintenanceModal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index: 1000;">
                            <div style="background:rgb(202, 198, 198); padding:20px; border-radius:8px; min-width:300px; position:relative;">
                                <h3>Planifier une maintenance</h3>
                                <form id="maintenanceForm" method="post" action="/planifier_maintenance">
                                    <label for="date_maintenance">Date :</label>
                                    <input type="date" id="date_maintenance" name="date_maintenance" required><br><br>
                                    <label for="commentaire">Commentaire :</label>
                                    <input type="text" id="commentaire" name="commentaire" required><br><br>
                                    <button type="submit">Enregistrer</button>
                                    <button type="button" id="closeModalBtn" style="margin-left:10px;">Annuler</button>
                                </form>
                            </div>
                           
    </div>

<script>
    function updateDateTime() {
        const now = new Date();
    
        const date = now.toLocaleDateString('fr-FR');
        const time = now.toLocaleTimeString('fr-FR');
    
        document.getElementById("datetime").innerHTML = date + " " + time;
    }
    
    // Met à jour toutes les secondes
    setInterval(updateDateTime, 1000);
    
    // Lancer immédiatement
    updateDateTime();
</script>

<script>
    const headers = document.querySelectorAll(".accordion-header");
    
    headers.forEach(header => {
        header.addEventListener("click", () => {
            const content = header.nextElementSibling;
    
            if (content.style.maxHeight) {
                content.style.maxHeight = null;
            } else {
                content.style.maxHeight = content.scrollHeight + "px";
            }
        });
    });
    </script>

    <script>
        document.getElementById('openModalBtn').onclick = function() {
            document.getElementById('maintenanceModal').style.display = 'flex';
        };
        document.getElementById('closeModalBtn').onclick = function() {
            document.getElementById('maintenanceModal').style.display = 'none';
        };
        // Optionnel : fermer la modale après soumission
        document.getElementById('maintenanceForm').onsubmit = function() {
            document.getElementById('maintenanceModal').style.display = 'none';
            // Laisse le formulaire se soumettre normalement (POST)
        };
    </script>
</body>
</html>
