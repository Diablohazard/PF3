services:
  app:
    build: .
    restart: always
    ports:
      - "8180:8180"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: pf3
      DB_USER: pf3user
      DB_PASSWORD: pf3password

  db:
    image: mysql:8.0.45-bookworm
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: pf3
      MYSQL_USER: pf3user
      MYSQL_PASSWORD: pf3password
    ports:
      - "8181:3306"
    volumes:
      - db_data:/var/lib/mysql
volumes:
  db_data:
